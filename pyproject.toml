[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mykr-ops"
version = "0.1.0"
description = "MyKr-ops is a deterministic, local-first Windows automation toolkit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mykr-ops = "mykr_ops.cli:main"

[project.gui-scripts]
mykr-ops-rename = "mykr_ops.rename_launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
